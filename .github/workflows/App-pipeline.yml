name:  CI/CD Pipeline -> build ->deploy

on:
  push:
    branches: [ "development"  ]

jobs:

  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: reservation_db
          MYSQL_ROOT_PASSWORD: Oudrina@1234
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -pOudrina@1234" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/reservation_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: Oudrina@1234
    
  build-and-deploy-app:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  
      
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: '17'
        
    - name: Build jar file
      run: |
       chmod +x ./mvnw
       ./mvnw clean package -DskipTests
      
    - name: Login into dockerhub
      uses: docker/login-action@v4
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
    - name: Build the image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/springboot-reservation:latest .
      
    - name: Push the image into docker
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/springboot-reservation:latest

   
   
