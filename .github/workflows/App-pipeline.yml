name:  CI/CD Pipeline -> build ->deploy

on:
  push:
    branches: [ "development"  ]

jobs:

  build-and-deploy-app:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  
      
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: '17'
        
    - name: Build jar file
      run: |
       chmod +x ./mvnw
       ./mvnw clean package -DskipTests
      
    - name: Login into dockerhub
      uses: docker/login-action@v4
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
    - name: Build the image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/springboot-reservation:latest
      
    - name: Push the image into docker
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/springboot-reservation:latest

   
   
